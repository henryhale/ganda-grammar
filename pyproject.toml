[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ganda-grammar"
dynamic = ["version"]  # from the git tag, by hatch-vcs: v0.1.0 → 0.1.0
description = "Luganda spelling and grammar correction by cited rules."
readme = "README.md"
authors = [{ name = "Henry Hale" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []  # pure Python
keywords = ["luganda", "ganda", "grammar", "spelling", "orthography", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/henryhale/ganda-grammar"
Documentation = "https://henryhale.github.io/ganda-grammar/"
Issues = "https://github.com/henryhale/ganda-grammar/issues"
Author = "https://github.com/henryhale"
"Word list" = "https://huggingface.co/datasets/henryhale/luganda-words"

[project.optional-dependencies]
mine = ["datasets"]  # ganda-grammar mine/fix --hf: a Hugging Face dataset
test = ["pytest"]
docs = ["mkdocs-material"]

[project.scripts]
ganda-grammar = "ganda_grammar.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "ganda_grammar"

[tool.hatch.build.targets.sdist]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
